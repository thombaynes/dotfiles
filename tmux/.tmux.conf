#### CUSTOM BINDINGS
# remap prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-Space
bind-key Space send-prefix
# Reload Tmux config with C-r
bind-key R source-file ~/.tmux.conf \; display-message "TMUX CONFIG RELOADED"
# Restart Rails server
bind-key r run-shell -c '#{pane_current_path}' "touch tmp/restart.txt"\; display-message "RESTART RAILS"

#### GENERAL SETTINGS
# Prefer a real emacs over limited VIM option that is the default. Basically want it to feel like a terminal.
set -g status-keys "emacs"
# Make sure ESC key in nvim is fast - default has a delay
set -s escape-time 0
# Enable mouse mode (tmux 2.1 and above)
# set -g mouse on # decided to be hardcode and force keyboard


#### SCROLL MODE SETTINGS
# Scroll mode has vi binding. Run list-keys -T copy-mode-vi to see list of commands
set-window-option -g mode-keys vi
# Setup 'v' to begin selection as in Vim, and 'y' to copy it to the macOS clipboard
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
bind-key -T copy-mode-vi C-v send -X rectangle-toggle


#### UI SETTINGS
# I think iTerm2 does this for me, but allows more colours.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
# Blinking block at the shell prompt. Without this tmux resets the cursor to a steady block whenever a program (e.g. nvim) exits.
set -g cursor-style blinking-block
# Colors that are less blinding
set-option -g status-bg '#666666'
set-option -g status-fg '#aaaaaa'
# More room to display session name
set-option -g status-left-length 50
# Date and time on the right
set-option -g status-right " %a, %b %d - %I:%M "


#### WINDOW MANAGEMENT
# Make new windows at the current path
bind c new-window -c '#{pane_current_path}'
# Start windows and panes at 1, not 0
set-option -g base-index 1
set-option -g renumber-windows on
setw -g pane-base-index 1


#### PANE MANAGEMENT
# split panes using \ and -, at the current path (also unbind defaults)
bind-key \\ split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %
# Wide pane borders. Ghostty draws box-drawing glyphs itself so "heavy" still looks thin there (iTerm2 uses the font's glyphs, which are thicker). Drawing "simple" characters with fg == bg gives a solid one-cell bar in any terminal.
set -g pane-border-lines simple
set -g pane-border-style 'fg=#444444,bg=#444444'
set -g pane-active-border-style 'fg=#888888,bg=#888888'
# Smart pane switching with awareness of Neovim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# Break pane out into a separate window
bind-key b break-pane -d
# Fine adjustment (1 or 2 cursor cells per bump)
bind -n S-Left resize-pane -L 5
bind -n S-Right resize-pane -R 5
bind -n S-Down resize-pane -D 5
bind -n S-Up resize-pane -U 5
# Coarse adjustment (5 or 10 cursor cells per bump)
# bind -n C-Left resize-pane -L 10 #busted
# bind -n C-Right resize-pane -R 10 #busted
# bind -n C-Down resize-pane -D 5
# bind -n C-Up resize-pane -U 5


#### NEOVIM SETTINGS
# Turned on to allow nvim to automatically reload files when changed outside of nvim.
set -g focus-events on


#### PLUGINS (TPM: prefix + I installs, prefix + U updates)
# Sidebar of every agent session across tmux. prefix + e toggles it in this window, prefix + E everywhere.
set -g @plugin 'hiroppy/tmux-agent-sidebar'
# No macOS desktop notifications (they arrive as osascript / Script Editor alerts)
set -g @sidebar_notifications off
# Keep this at the very bottom
run '~/.tmux/plugins/tpm/tpm'
